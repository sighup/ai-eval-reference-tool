name: Check your progress

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: Check one chapter, or all chapters for a full scorecard. This never blocks merges and never certifies.
        required: true
        default: "all chapters"
        type: choice
        options:
          - "all chapters"
          - "setup"
          - "1.2"
          - "2.1"
          - "2.2"
          - "2.3"
          - "2.4"
          - "3.1"
          - "3.2"
          - "4.3"
          - "4.5"
          - "4.7"
          - "5.1"
          - "5.3"
          - "5.6"
          - "6.2"
          - "6.4"
          - "capstone"

concurrency:
  group: check-progress-${{ github.actor }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test scorecard scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Run progress scorecard
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          CHAPTER: ${{ inputs.chapter }}
          LEARNER_REPO_DIR: ${{ github.workspace }}
        run: node .github/scripts/check-deterministic.mjs
